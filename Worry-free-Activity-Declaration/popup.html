<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动申报助手</title>
    <style>
        body {
            width: 400px;
            min-height: 500px;
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
        }
        
        .container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h1 {
            margin: 0 0 20px 0;
            color: #333;
            font-size: 18px;
            text-align: center;
        }
        
        .category-list {
            margin-bottom: 20px;
        }
        
        .category-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }
        
        .category-input {
            flex: 1;
            margin-right: 8px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .price-input {
            width: 80px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            text-align: right;
        }
        
        .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
        }
        
        .remove-btn:hover {
            background: #c82333;
        }
        
        .add-btn {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-bottom: 16px;
        }
        
        .add-btn:hover {
            background: #0056b3;
        }
        
        .action-btn {
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-bottom: 8px;
        }
        
        .action-btn:hover {
            background: #218838;
        }
        
        .action-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        
        .input-group {
            margin-bottom: 8px;
        }
        
        /* 进度条样式 */
        .progress-container {
            margin: 16px 0;
            text-align: center;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #20c997);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }
        
        .progress-text {
            font-size: 12px;
            color: #666;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 活动申报助手 V1.0.9</h1>
        
        <div class="category-list" id="categoryList">
            <!-- 品类配置项将在这里动态生成 -->
        </div>
        
        <button class="add-btn" id="addCategoryBtn">➕ 添加品类配置</button>
        
        <!-- 勾选数量限制设置 -->
        <div class="category-item" style="margin-bottom: 16px;">
            <div style="flex: 1;">
                <div class="label">最大勾选数量</div>
                <input type="number" id="maxCheckedItems" class="category-input" 
                       value="200" min="1" max="1000" 
                       placeholder="默认200个">
            </div>
            <div style="margin-left: 8px; color: #666; font-size: 12px; align-self: center;">
                个商品
            </div>
        </div>
        
        <button class="action-btn" id="startBtn">🚀 开始自动勾选</button>
        <button class="action-btn" id="stopBtn" disabled>⏹️ 停止自动勾选</button>
        
        <!-- 进度条 -->
        <div class="progress-container" id="progressContainer" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>
        
        <div class="status info" id="status">
            请配置品类和最低价格，然后点击开始自动勾选
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
